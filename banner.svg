<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="ChainPass">
  <defs>
    <linearGradient id="bg_ChainPass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0.00" stop-color="#0b1220"/><stop offset="0.33" stop-color="#0f172a"/><stop offset="0.67" stop-color="#1e1b4b"/><stop offset="1.00" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="g_ChainPass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
