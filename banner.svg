<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="ChainPass" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f5c451"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <ellipse cx="980" cy="200" rx="205" ry="170" fill="url(#glow)"/>
  <circle cx="250" cy="300" r="9" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="1130" cy="74" r="11" fill="#f5c451" opacity="0.6"/>
  <circle cx="1170" cy="320" r="7" fill="#5eead4" opacity="0.6"/>
  <rect x="-220" y="0" width="220" height="380" fill="url(#beam)">
    <animate attributeName="x" values="-220;1300;-220" dur="7.5s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(980,190)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 0 0;10 0 0;-10 0 0" dur="3.4s" repeatCount="indefinite"/>
      <circle cx="0" cy="-62" r="44" fill="url(#body)" stroke="#f5c451" stroke-width="11"/>
      <circle cx="0" cy="-62" r="20" fill="#0a0f24"/>
      <circle cx="-14" cy="-66" r="6" fill="#0a0f24"/>
      <circle cx="14" cy="-66" r="6" fill="#0a0f24"/>
      <path d="M-15,-48 Q0,-36 15,-48" fill="none" stroke="#0a0f24" stroke-width="6" stroke-linecap="round"/>
      <rect x="-10" y="-18" width="20" height="124" rx="10" fill="url(#body)" stroke="#5eead4" stroke-width="9"/>
      <rect x="10" y="58" width="28" height="13" rx="5" fill="#f5c451" stroke="#5eead4" stroke-width="5"/>
      <rect x="10" y="82" width="21" height="13" rx="5" fill="#f5c451" stroke="#5eead4" stroke-width="5"/>
    </g>
  </g>
  <line x1="72" y1="170" x2="430" y2="170" stroke="#f5c451" stroke-width="6" stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="358">
    <animate attributeName="stroke-dashoffset" values="358;0;0;358" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="70" y="150" font-size="60" font-weight="800" fill="url(#title)">ChainPass</text>
  <text x="72" y="198" font-size="22" fill="#a7e6da" opacity="0.92">W3C DID · 可验证凭证 · 跨境支付</text>
  <g font-size="16" font-weight="600">
    <rect x="72" y="220" width="120" height="34" rx="17" fill="#5eead4" opacity="0.20" stroke="#7fe9d8" stroke-width="2"/>
    <text x="132" y="242" fill="#c8f6ee" text-anchor="middle">DID</text>
    <rect x="204" y="220" width="120" height="34" rx="17" fill="#f5c451" opacity="0.18" stroke="#f5c451" stroke-width="2"/>
    <text x="264" y="242" fill="#fce9b0" text-anchor="middle">合规</text>
  </g>
