<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="ChainPass">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.5" stop-color="#141b3c"/>
      <stop offset="1" stop-color="#0e2a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="1280" height="380" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1280" height="380" fill="url(#bg)"/>
    <circle cx="158" cy="72" r="150" fill="#1e3a8a" opacity="0.5" filter="url(#soft)"/>
    <circle cx="1150" cy="322" r="142" fill="#0e7490" opacity="0.42" filter="url(#soft)"/>

    <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#title)">ChainPass</text>
    <text x="72" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">跨境数字身份 · 合规支付 · 区块链信任层</text>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
      <rect x="72" y="220" width="98" height="34" rx="17" fill="#0e2a3a" stroke="#22d3ee"/>
      <text x="121" y="242" text-anchor="middle" fill="#67e8f9">区块链</text>
      <rect x="180" y="220" width="78" height="34" rx="17" fill="#0e2a3a" stroke="#22d3ee"/>
      <text x="219" y="242" text-anchor="middle" fill="#67e8f9">身份</text>
      <rect x="268" y="220" width="78" height="34" rx="17" fill="#0e2a3a" stroke="#22d3ee"/>
      <text x="307" y="242" text-anchor="middle" fill="#67e8f9">合规</text>
    </g>

    <g transform="translate(1000,195)">
      <ellipse cx="-72" cy="6" rx="48" ry="32" fill="none" stroke="url(#metal)" stroke-width="14" transform="rotate(-22 -72 6)"/>
      <ellipse cx="0" cy="-10" rx="48" ry="32" fill="none" stroke="#a78bfa" stroke-width="14" transform="rotate(20 0 -10)"/>
      <ellipse cx="72" cy="6" rx="48" ry="32" fill="none" stroke="url(#metal)" stroke-width="14" transform="rotate(-22 72 6)"/>
      <path d="M -16 -10 L -4 -2 L 18 -22" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" values="60;0" dur="2s" repeatCount="indefinite"/>
      </path>
      <circle r="7" fill="#fde68a" filter="url(#glow)">
        <animateMotion dur="3.4s" repeatCount="indefinite" rotate="auto" path="M -72 6 Q -36 -42 0 -10 Q 36 32 72 6"/>
      </circle>
    </g>
  </g>
</svg>
